<style>

  .progress-num b { color:#1F2329; font-weight:700; }
  .bar { height:4px; background:#E8E8EC; border-radius:99px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#FF9A40,#FF6B00); border-radius:99px; transition:width .25s ease; }

  .stage { flex:1; position:relative; overflow:hidden; margin-top:6px; }
  .card {

    box-shadow:0 8px 30px rgba(31,35,41,.07), 0 1px 3px rgba(31,35,41,.04);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 26px 26px; text-align:center;
    transition:transform .18s ease, opacity .18s ease; will-change:transform;
  }
  .card.enter-left { transform:translateX(60px); opacity:0; transition:none; }
  .card.enter-right { transform:translateX(-60px); opacity:0; transition:none; }

  .page-tag { position:absolute; top:16px; right:18px; font-size:11px; color:#C3C7CF; font-weight:500; }
  .seq-tag { position:absolute; top:16px; left:18px; font-size:11px; color:#C3C7CF; font-weight:600; font-variant-numeric:tabular-nums; }

  .word { font-size:clamp(30px,9vw,44px); font-weight:800; color:#FF6B00; letter-spacing:.2px; line-height:1.15; word-break:break-word; }

  .speak { margin-top:10px; display:inline-flex; align-items:center; gap:7px; background:#FFF3E9; border-radius:99px; padding:6px 14px; border:none; cursor:pointer; }

  .speak .ph { font-size:14px; color:#8A8F99; }
  .speak .ph:empty { display:none; }
  .speak svg { width:15px; height:15px; flex:none; }

  .defs { margin-top:26px; width:100%; max-width:340px; }

  .marked { position:absolute; bottom:16px; left:18px; font-size:11px; font-weight:600; display:none; }

  .card.is-known .marked.known { display:block; color:#10B981; }

  .actions { flex:none; padding:6px 18px 4px; display:flex; gap:12px; }
  .btn { flex:1; height:52px; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; border:none; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn:active { transform:scale(.97); }
  .btn-known { background:#F0FDF6; color:#10B981; border:1.5px solid #BBF0D5; }
  .btn-star { background:#FFF6EF; color:#FF6B00; border:1.5px solid #FFDDC0; }

  .nav-arrow { width:52px; height:48px; flex:none; border-radius:99px; background:#fff; border:1px solid #E8E8EC; box-shadow:0 2px 8px rgba(31,35,41,.05); font-size:19px; color:#8A8F99; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .nav-next { flex:1; height:48px; border-radius:99px; background:#1F2329; color:#fff; border:none; font-size:15px; cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px; }
  .nav-next:active { opacity:.9; }
  .nav-next .lab { color:#9DA3AE; font-size:11px; font-weight:500; flex:none; }
  .nav-next .nword { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .summary { display:none; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
  .summary h2 { font-size:24px; margin-bottom:8px; }
  .summary .sub { color:#8A8F99; font-size:14px; margin-bottom:26px; }
  .stats { display:flex; gap:14px; margin-bottom:30px; width:100%; max-width:320px; }
  .stat { flex:1; background:#fff; border-radius:18px; padding:16px 8px; box-shadow:0 4px 16px rgba(31,35,41,.05); }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; color:#8A8F99; }
  .stat.ok b { color:#10B981; } .stat.star b { color:#FF6B00; }
  .starlist { width:100%; max-width:340px; max-height:34vh; overflow-y:auto; background:#fff; border-radius:18px; padding:8px 0; box-shadow:0 4px 16px rgba(31,35,41,.05); display:none; }

const STORE_KEY = 'wc_day5';
let state = load() || { known: [], star: [], last: 0, starOnly: false };
let i = Math.min(state.last, WORDS.length - 1);

function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ return null; } }
function save(){ state.last = i; try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }

const $ = id => document.getElementById(id);
const card = $('card'), summary = $('summary');

function isStar(idx){ return state.star[idx]; }
function isKnown(idx){ return state.known[idx]; }

function visibleIndices(){
  if (state.starOnly) { const v = WORDS.map((_,k)=>k).filter(k=>isStar(k)); return v.length ? v : WORDS.map((_,k)=>k); }
  return WORDS.map((_,k)=>k);
}

  if (dir === 1) { card.classList.add('enter-left'); } else if (dir === -1) { card.classList.add('enter-right'); }

  card.classList.toggle('is-known', !!isKnown(i));

  const nextIdx = vis[(pos+1) % vis.length];
  $('nextword').textContent = WORDS[nextIdx].word;
  $('cur').textContent = pos + 1;
  $('total').textContent = vis.length;
  $('barfill').style.width = ((pos+1)/vis.length*100) + '%';
  if (state.starOnly) { $('btnAgain').textContent = '返回全部'; } else { $('btnAgain').textContent = '只刷生词'; }
  save();
  speak(false);
}

function speak(loud){
  if (!('speechSynthesis' in window)) return;
  if (!loud && document.hidden) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(WORDS[i].word);
    u.lang = 'en-US'; u.rate = .92;
    speechSynthesis.speak(u);
  } catch(e){}
}

function go(step){
  const vis = visibleIndices();
  let pos = vis.indexOf(i);
  pos = (pos + step + vis.length) % vis.length;
  i = vis[pos];
  render(step > 0 ? 1 : -1);
}

function mark(kind, val){
  const vis = visibleIndices();
  if (kind === 'known') { state.known[i] = val; if (val) state.star[i] = false; }
  else { state.star[i] = val; if (val) state.known[i] = false; }
  save();
  const pos = vis.indexOf(i);
  if (pos === vis.length - 1) { render(0); setTimeout(finishMaybe, 350); }
  else go(1);
}

function finishMaybe(){
  const vis = visibleIndices();
  const pos = vis.indexOf(i);
  if (pos === vis.length - 1) showSummary();
}

function showSummary(){
  card.style.display = 'none';
  summary.style.display = 'flex';
  $('actions').style.visibility = 'hidden';
  const nK = WORDS.filter((_,k)=>isKnown(k)).length;
  const nS = WORDS.filter((_,k)=>isStar(k)).length;
  $('nKnown').textContent = nK; $('nStar').textContent = nS;
  $('nLeft').textContent = WORDS.length - nK - nS;
  $('sumSub').textContent = state.starOnly ? '生词二刷完毕，晚 21:00 复盘见' : WORDS.length + ' 词快过完成，晚上复盘时告诉我生词背了没';
  const list = $('starlist'); list.innerHTML = '';
  if (nS > 0) {
    list.style.display = 'block';
    WORDS.forEach((w,k)=>{ if (isStar(k)) {
      const row = document.createElement('div'); row.className = 'st';
      row.innerHTML = '<b style="color:#FF6B00">' + w.word + '</b><em>' + (w.defs[0]||'') + '</em>';
      row.onclick = () => { i = k; state.starOnly = false; $('actions').style.visibility = 'visible'; render(0); };
      list.appendChild(row);
    }});
  } else { list.style.display = 'none'; }
}

$('btnKnown').onclick = () => mark('known', !isKnown(i));
$('btnStar').onclick = () => mark('star', !isStar(i));
$('prev').onclick = () => go(-1);
$('next').onclick = () => { const vis = visibleIndices(); const pos = vis.indexOf(i); if (pos === vis.length-1) showSummary(); else go(1); };
$('skip').onclick = () => go(1);
$('speak').onclick = () => speak(true);
$('btnAgain').onclick = () => {
  state.starOnly = !state.starOnly;
  $('actions').style.visibility = 'visible';
  const vis = visibleIndices();
  i = vis[0];
  render(0);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

let sx = 0, dx = 0, swiping = false;
const stage = $('stage');
stage.addEventListener('touchstart', e => { if (summary.style.display === 'flex') return; sx = e.touches[0].clientX; dx = 0; swiping = true; card.style.transition = 'none'; }, {passive:true});
stage.addEventListener('touchmove', e => { if (!swiping) return; dx = e.touches[0].clientX - sx; card.style.transform = 'translateX(' + dx + 'px)'; card.style.opacity = String(1 - Math.min(Math.abs(dx)/300, .5)); }, {passive:true});
stage.addEventListener('touchend', () => {
  if (!swiping) return; swiping = false;
  card.style.transition = ''; card.style.transform = ''; card.style.opacity = '';
  if (dx < -55) go(1); else if (dx > 55) go(-1);
});

render(0);
</script>
</body>
</html>
