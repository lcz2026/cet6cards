function isKnown(idx){ return state.known[idx]; }

// 🔧 v2 修复：二刷改用「快照队列」——点「只刷生词」那一刻锁定生词清单，
// 刷完队列必进结算页。旧版实时按生词标记重算：二刷中点「认识划过」会把词
// 从生词里移走，最后一个被移走后列表瞬间回退成全部单词，导致无法结算、
// 继续往后刷全部单词，且中途移词还会跳过下一个词。
function buildQueue(){ return WORDS.map((_,k)=>k).filter(k=>isStar(k)); }
function visibleIndices(){
  if (state.starOnly) return Array.isArray(state.queue) ? state.queue : [];
  return WORDS.map((_,k)=>k);
}

// 旧版存档恢复：starOnly 但无队列 → 用当前生词重建；无生词 → 退出二刷模式
if (state.starOnly) {
  if (!Array.isArray(state.queue) || !state.queue.length) {
    const q = buildQueue();
    if (q.length) state.queue = q; else state.starOnly = false;
  }
} else { state.queue = null; }

let i = Math.min(state.last, WORDS.length - 1);
if (state.starOnly && state.queue.indexOf(i) === -1) i = state.queue[0];

function render(dir){
  let vis = visibleIndices();
  if (!vis.length) { state.starOnly = false; state.queue = null; vis = visibleIndices(); }  // 队列空兜底：回全部模式
  let pos = vis.indexOf(i); if (pos === -1) { i = vis[0] || 0; pos = 0; }  // 位置失效兜底：重置后同步修正 pos，防止页码显示 0
  const w = WORDS[i];
  summary.style.display = 'none';
  card.style.display = 'flex';
  if (dir === 1) { card.classList.add('enter-left'); } else if (dir === -1) { card.classList.add('enter-right'); }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ card.classList.remove('enter-left','enter-right'); }));

  $('seq').textContent = '#' + (i+1);
  $('pagetag').textContent = '第' + w.page + '页';
  $('word').textContent = w.word;
  $('phone').textContent = w.phone ? '/' + w.phone + '/' : '';
  const defs = $('defs'); defs.innerHTML = '';
  const defArr = w.defs.length ? w.defs : ['—'];
  defArr.forEach(t => {
    const div = document.createElement('div'); div.className = 'def';
    const pos = document.createElement('span'); pos.className = 'pos'; pos.textContent = w.pos;
    div.appendChild(pos); div.appendChild(document.createTextNode(t));
    defs.appendChild(div);
  });
  card.classList.toggle('many', defArr.length >= 8);
  card.classList.toggle('is-star', !!isStar(i));
  card.classList.toggle('is-known', !!isKnown(i));

  const nextIdx = vis[(pos+1) % vis.length];
  $('nextword').textContent = WORDS[nextIdx].word;
  $('cur').textContent = pos + 1;
  $('total').textContent = vis.length;
  $('barfill').style.width = ((pos+1)/vis.length*100) + '%';
  if (state.starOnly) { $('btnAgain').textContent = '返回全部'; } else { $('btnAgain').textContent = '只刷生词'; }
  save();
  speak(false);
}

function speak(loud){
  if (!('speechSynthesis' in window)) return;
  if (!loud && document.hidden) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(WORDS[i].word);
    u.lang = 'en-US'; u.rate = .92;
    speechSynthesis.speak(u);
  } catch(e){}
}

function go(step){
  const vis = visibleIndices();
  let pos = vis.indexOf(i);
  pos = (pos + step + vis.length) % vis.length;
  i = vis[pos];
  render(step > 0 ? 1 : -1);
}

function mark(kind, val){
  const posBefore = visibleIndices().indexOf(i);  // 以点击那一刻的队列为准
  if (kind === 'known') { state.known[i] = val; if (val) state.star[i] = false; }
  else { state.star[i] = val; if (val) state.known[i] = false; }
  save();
  if (posBefore === -1) { render(0); return; }
  const vis = visibleIndices();
  if (posBefore === vis.length - 1) { render(0); setTimeout(finishMaybe, 350); }
  else { i = vis[Math.min(posBefore + 1, vis.length - 1)]; render(1); }
}

function finishMaybe(){
  const vis = visibleIndices();
  const pos = vis.indexOf(i);
  if (pos === vis.length - 1) showSummary();
}

function showSummary(){
  card.style.display = 'none';
  summary.style.display = 'flex';
  $('actions').style.visibility = 'hidden';
  const nK = WORDS.filter((_,k)=>isKnown(k)).length;
  const nS = WORDS.filter((_,k)=>isStar(k)).length;
  $('nKnown').textContent = nK; $('nStar').textContent = nS;
  $('nLeft').textContent = WORDS.length - nK - nS;
  $('sumSub').textContent = state.starOnly ? '生词二刷完毕，晚 21:00 复盘见' : WORDS.length + ' 词快过完成，晚上复盘时告诉我生词背了没';
  const list = $('starlist'); list.innerHTML = '';
  if (nS > 0) {
    list.style.display = 'block';
    WORDS.forEach((w,k)=>{ if (isStar(k)) {
      const row = document.createElement('div'); row.className = 'st';
      row.innerHTML = '<b style="color:#FF6B00">' + w.word + '</b><em>' + (w.defs[0]||'') + '</em>';
      row.onclick = () => { i = k; state.starOnly = false; $('actions').style.visibility = 'visible'; render(0); };
      list.appendChild(row);
    }});
  } else { list.style.display = 'none'; }
}

$('btnKnown').onclick = () => mark('known', !isKnown(i));
$('btnStar').onclick = () => mark('star', !isStar(i));
$('prev').onclick = () => go(-1);
$('next').onclick = () => { const vis = visibleIndices(); const pos = vis.indexOf(i); if (pos === vis.length-1) finishMaybe(); else go(1); };
$('skip').onclick = () => go(1);
$('speak').onclick = () => speak(true);
$('btnAgain').onclick = () => {
  if (!state.starOnly) {
    const q = buildQueue();
    if (!q.length) { alert('目前没有生词，全部划过 ✓'); return; }
    state.fullLast = i;                        // 记住一刷位置：退出二刷时回到这里，不再甩回 #1
    state.starOnly = true; state.queue = q;   // 快照队列：进入二刷时锁定生词清单
  } else {
    state.starOnly = false; state.queue = null;
    if (typeof state.fullLast === 'number' && state.fullLast >= 0 && state.fullLast < WORDS.length) i = state.fullLast;
    state.fullLast = null;
  }
  $('actions').style.visibility = 'visible';
  const vis = visibleIndices();
  if (vis.indexOf(i) === -1) i = vis[0] || 0;
  render(0);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

let sx = 0, dx = 0, swiping = false;
const stage = $('stage');
stage.addEventListener('touchstart', e => { if (summary.style.display === 'flex') return; sx = e.touches[0].clientX; dx = 0; swiping = true; card.style.transition = 'none'; }, {passive:true});
stage.addEventListener('touchmove', e => { if (!swiping) return; dx = e.touches[0].clientX - sx; card.style.transform = 'translateX(' + dx + 'px)'; card.style.opacity = String(1 - Math.min(Math.abs(dx)/300, .5)); }, {passive:true});
stage.addEventListener('touchend', () => {
  if (!swiping) return; swiping = false;
  card.style.transition = ''; card.style.transform = ''; card.style.opacity = '';
  if (dx < -55) go(1); else if (dx > 55) go(-1);
});

render(0);
</script>
</body>
</html>
